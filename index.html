<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef2f8">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="课序 — 一个像 macOS 原生应用一样顺手的本地课表工作台，支持分周课表、批量节次时间与 iCal 导入。">
  <title>课序 · 课表工作台</title>
  <link rel="icon" type="image/svg+xml" href="assets/app-icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <span class="wallpaper-blob blob-a"></span>
    <span class="wallpaper-blob blob-b"></span>
    <span class="wallpaper-blob blob-c"></span>
    <span class="wallpaper-grid"></span>
  </div>

  <div class="app-window" id="appWindow">
    <aside class="sidebar" id="sidebar" aria-label="课表导航">
      <div class="traffic-lights" aria-hidden="true">
        <span class="traffic red"></span>
        <span class="traffic yellow"></span>
        <span class="traffic green"></span>
      </div>
      <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <button class="sidebar-scrim" id="sidebarScrim" type="button" aria-label="关闭导航" tabindex="-1"></button>

    <main class="main" aria-label="课表主区域">
      <header class="topbar" id="topbar"></header>
      <div class="view-host" id="viewHost"></div>
      <footer class="statusbar" id="statusbar"></footer>
    </main>
  </div>

  <div id="overlayRoot"></div>
  <div id="toastRoot" class="toast-root" role="status" aria-live="polite"></div>
  <div id="tooltipRoot" class="tooltip-root" aria-hidden="true"></div>

  <input type="file" id="icsFileInput" accept=".ics,text/calendar" hidden>
  <input type="file" id="jsonFileInput" accept=".json,application/json" hidden>

  <noscript>
    <div class="noscript">需要启用 JavaScript 才能使用课序。</div>
  </noscript>

  <script defer src="js/utils.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/ical.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
